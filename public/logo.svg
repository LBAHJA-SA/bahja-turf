<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#c5a146"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="60" rx="12" fill="url(#g)"/>
  <!-- Koutoubia silhouette -->
  <g fill="white" opacity="0.12">
    <rect x="22" y="18" width="10" height="22" rx="1"/>
    <rect x="24" y="12" width="6" height="8" rx="1"/>
    <rect x="26" y="8" width="2" height="6"/>
    <circle cx="27" cy="7" r="1.5"/>
    <!-- arches -->
    <rect x="23" y="32" width="2" height="4" rx="1"/><rect x="27" y="32" width="2" height="4" rx="1"/>
  </g>
  <!-- Horse racing silhouette -->
  <g transform="translate(38,10)">
    <path d="M12 18 Q16 12 22 14 L28 10 Q32 8 34 12 L30 16 Q26 18 22 18 L18 22 L14 22 Z" fill="white" opacity="0.95"/>
    <circle cx="32" cy="9" r="2.5" fill="white"/>
    <path d="M22 14 L26 6 L28 6 L24 14 Z" fill="white" opacity="0.9"/>
    <!-- jockey -->
    <circle cx="26" cy="7" r="2" fill="#22c55e"/>
    <path d="M26 9 L22 14 L26 12 Z" fill="#22c55e"/>
  </g>
  <!-- Text -->
  <text x="78" y="24" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="16" fill="white" letter-spacing="-0.5">Bahja</text>
  <text x="78" y="38" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="14" fill="#22c55e" letter-spacing="1">TURF</text>
  <text x="78" y="48" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="6.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.8">FRANCE • MAROC • MARRAKECH</text>
  <!-- Gold underline -->
  <rect x="78" y="41" width="42" height="1.5" rx="1" fill="url(#gold)" opacity="0.8"/>
</svg>
